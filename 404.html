<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MinsuGPT</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Google Sans", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #dbeafe 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, #fce7f3 0%, transparent 40%),
        #ffffff;
      color: #111111;
      padding: 20px;
    }
    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 20px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(40px, 8vw, 56px);
      line-height: 1;
      letter-spacing: -0.03em;
    }
    p {
      margin: 0 0 18px;
      font-size: 15px;
      color: #374151;
    }
    a {
      display: inline-block;
      text-decoration: none;
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: #111111;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>페이지를 찾을 수 없습니다. MinsuGPT 홈으로 이동해 주세요.</p>
    <a href="/minsugpt/">MinsuGPT 홈으로</a>
  </main>
</body>
</html>
