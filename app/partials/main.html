<main id="main-panel" class="flex-1 bg-gradient-custom flex flex-col items-center px-4 min-h-0 overflow-hidden welcome-mode" style="padding-bottom: 0;">
    <div id="welcome-block" class="flex-1 flex flex-col items-center justify-center w-full">
      <h1 class="text-2xl md:text-3xl font-light text-gray-600 tracking-tight text-center">
        안녕하세요, <span class="font-normal text-gray-900">무엇을 도와드릴까요?</span>
      </h1>
    </div>

    <div id="chat-messages" class="chat-column hidden flex-1 min-h-0 overflow-y-auto px-1 space-y-4 w-full" style="padding-bottom: 24px;"></div>

    <div id="chat-error" class="chat-column hidden mb-2 px-3 py-2 text-[13px] text-red-600 bg-red-50 border border-red-100 rounded-xl w-full max-w-[40rem]"></div>

    <div id="input-box" class="chat-column bg-white rounded-[24px] shadow-sm border border-gray-200/90 p-2.5 pb-2 flex flex-col justify-between min-h-[92px] transition-all duration-200 focus-within:shadow-md shrink-0 mb-3 w-full max-w-[40rem]">

      <div id="attach-chip-row" class="attach-chip-row hidden"></div>

      <div id="attach-panel" class="attach-panel hidden">
        <div class="attach-panel-grid">
          <button type="button" id="attach-pick-photo" class="attach-square-btn">
            <i data-lucide="image" class="w-5 h-5"></i>
            <span>사진</span>
          </button>
          <button type="button" id="attach-pick-file" class="attach-square-btn">
            <i data-lucide="file" class="w-5 h-5"></i>
            <span>파일</span>
          </button>
          <button type="button" id="attach-pick-camera" class="attach-square-btn">
            <i data-lucide="camera" class="w-5 h-5"></i>
            <span>카메라</span>
          </button>
        </div>
        <div class="attach-toggle-group">
          <button type="button" id="toggle-reasoning" class="attach-toggle-row">
            <i data-lucide="brain" class="w-4 h-4"></i>
            <span>생각 더 하기</span>
          </button>
          <button type="button" id="toggle-search" class="attach-toggle-row">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span>검색</span>
          </button>
        </div>
        <button type="button" id="attach-panel-close" class="attach-panel-close-btn">
          <i data-lucide="chevron-down" class="w-4 h-4"></i>
          <span>닫기</span>
        </button>
      </div>

      <input type="file" id="attach-file-photo" accept="image/*" class="hidden-file-input">
      <input type="file" id="attach-file-generic" class="hidden-file-input">
      <input type="file" id="attach-file-camera" accept="image/*" capture="environment" class="hidden-file-input">

      <div class="w-full mb-1 flex items-center mt-1">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="MinsuGPT 에게 물어보기"
          class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400 text-[14px] px-1.5 font-normal resize-none h-6 block max-h-36 align-middle"
        ></textarea>
      </div>

      <div class="flex items-center justify-between pt-1">
        <div class="flex items-center">
          <button id="attach-btn" type="button" class="ripple-btn text-gray-500 hover:bg-gray-100 w-9 h-9 min-w-[36px] min-h-[36px] rounded-full flex items-center justify-center transition-colors">
            <i data-lucide="plus" class="w-4 h-4 text-gray-500"></i>
          </button>
          <div id="active-toggle-icons" class="active-toggle-icons hidden"></div>
        </div>

        <div class="flex items-center space-x-1.5">
          <div class="ripple-btn flex items-center space-x-1 cursor-pointer text-gray-500 hover:bg-gray-50 px-2.5 py-1.5 rounded-lg text-xs font-medium">
            <span>사고 모델</span>
            <i data-lucide="chevron-down" class="w-3 h-3"></i>
          </div>

          <button
            id="send-btn"
            disabled
            class="w-0 min-w-0 h-9 min-h-[36px] px-0 ml-0 rounded-full flex items-center justify-center bg-gray-100 text-gray-400 opacity-0 pointer-events-none cursor-not-allowed"
          >
            <i data-lucide="send" class="w-4 h-4 shrink-0"></i>
          </button>
        </div>
      </div>
    </div>
  </main>
