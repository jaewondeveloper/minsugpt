<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - MinsuGPT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap');
        :root {
            --primary-color: #000;
            --border-color: #e5e7eb;
            --text-main: #000;
            --text-muted: #6b7280;
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            font-family: 'Google Sans Flex', sans-serif;
        }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fff;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }
        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 650;
            cursor: pointer;
            text-decoration: none;
            color: #000;
        }
        .top-right-info {
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .mode-menu {
            position: fixed;
            z-index: 1200;
            min-width: 150px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.18);
            padding: 6px;
            display: none;
        }
        .mode-menu.show { display: block; }
        .mode-menu-btn {
            width: 100%;
            border: 0;
            border-radius: 8px;
            background: transparent;
            text-align: left;
            padding: 8px 10px;
            font-size: 13px;
            color: #374151;
            cursor: pointer;
        }
        .mode-menu-btn:hover {
            background: #f3f4f6;
        }
        .mode-menu-btn.active {
            background: #eaf2ff;
            color: #1d4ed8;
            font-weight: 600;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 400px;
            margin: -50px auto 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            text-align: center;
        }
        .login-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            color: #000;
            text-decoration: none;
            user-select: none;
        }
        .login-btn:hover {
            background-color: #f9f9f9;
        }
        .login-btn:active {
            transform: scale(0.96);
            background-color: #ebebeb;
        }
        .login-btn.black {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }
        .login-btn.black:hover {
            background-color: #222;
        }
        .login-btn.black:active {
            transform: scale(0.96);
            background-color: #333;
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        .btn-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        .btn-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: currentColor;
            animation: dotBlink 0.9s infinite ease-in-out;
        }
        .btn-dots span:nth-child(2) { animation-delay: 0.12s; }
        .btn-dots span:nth-child(3) { animation-delay: 0.24s; }
        @keyframes dotBlink {
            0%, 80%, 100% { opacity: 0.28; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }
        .email-login-form {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .email-login-form.show {
            display: flex;
        }
        .remember-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            padding: 0 4px;
            font-size: 13px;
            color: var(--text-muted);
            user-select: none;
        }
        .remember-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            border-radius: 5px;
            accent-color: #111;
            -webkit-appearance: auto;
            appearance: auto;
            cursor: pointer;
        }
        .form-inputs {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #000;
        }
        .error-message {
            color: var(--error-color);
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .footer-info {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }
        .footer-info a {
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }
        .legal-footer {
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .legal-footer a {
            color: var(--text-muted);
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 20px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .modal-content h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .modal-content p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            .top-right-info { display: none; }
            .main-container { padding: 20px 16px; margin-top: -30px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">MinsuGPT</a>
        <div class="top-right-info" id="topRightInfo">
            <strong id="topRightBrand">MinsuGPT</strong>에 로그인 중입니다
            <i class="ti ti-chevron-down" style="font-size: 14px;"></i>
        </div>
    </header>
    <div id="modeMenu" class="mode-menu">
        <button id="modeNormalBtn" class="mode-menu-btn" type="button">MinsuGPT</button>
        <button id="modeAdminBtn" class="mode-menu-btn" type="button">GPT ADMIN</button>
    </div>

    <div class="main-container">
        <h1>계정에 로그인하기</h1>
        <div class="login-buttons">
            <button class="login-btn" id="googleStubBtn" type="button">
                <i class="ti ti-brand-google" style="font-size: 20px;"></i>
                Google로 로그인
            </button>
            <button class="login-btn" id="emailToggleBtn" type="button">
                <i class="ti ti-mail" style="font-size: 20px;"></i>
                이메일로 로그인
            </button>

            <form class="email-login-form" id="emailForm">
                <div class="form-inputs">
                    <input type="text" id="emailInput" placeholder="이메일 또는 아이디" required>
                    <input type="password" id="passwordInput" placeholder="비밀번호" required>
                    <div class="error-message" id="loginError"></div>
                </div>
                <label class="remember-row" for="rememberLogin">
                    <input id="rememberLogin" type="checkbox">
                    자동 로그인 (최대 10일)
                </label>
                <button type="submit" id="submitBtn" class="login-btn black">계속하기</button>
            </form>
        </div>

        <div class="footer-info" id="signupFooter">
            계정이 없으신가요? <a href="signup.html">회원가입</a>
        </div>
    </div>

    <div class="legal-footer">
        계속 진행함으로써 MinsuGPT의 <a href="#">서비스 이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
    </div>

    <div id="unapprovedModal" class="modal">
        <div class="modal-content">
            <h2>승인 대기 중</h2>
            <p>아직 계정이 승인되지 않았습니다.<br>관리자의 승인 완료 후 이용 가능합니다.</p>
            <button class="login-btn black" type="button" onclick="document.getElementById('unapprovedModal').style.display='none'">확인</button>
        </div>
    </div>
    <div id="resetPasswordModal" class="modal">
        <div class="modal-content">
            <h2>비밀번호 재설정 필요</h2>
            <p>관리자가 비밀번호를 초기화했습니다.<br>새 비밀번호를 설정해주세요.</p>
            <input id="resetNewPasswordInput" type="password" placeholder="새 비밀번호 (8자 이상)" style="width:100%;padding:12px 16px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;margin-bottom:12px;">
            <button id="resetPasswordSubmitBtn" class="login-btn black" type="button">비밀번호 변경</button>
        </div>
    </div>

    <script>
        const AUTH_BASE = 'https://jaewondev6.pythonanywhere.com';
        const AUTH_LOGIN_PATH = '/api/auth/login';
        const AUTH_PENDING_CANCEL_PATH = '/api/auth/pending/cancel';
        const AUTH_RESET_COMPLETE_PATH = '/api/auth/password/reset-complete';
        const AUTH_STORAGE_KEY = 'minsugpt_auth_v1';
        const NORMAL_LOGIN_MS = 24 * 60 * 60 * 1000;
        const REMEMBER_LOGIN_MS = 10 * 24 * 60 * 60 * 1000;
        const LOGIN_REDIRECT = './';
        const initialAdminMode = new URLSearchParams(window.location.search).get('mode') === 'admin' || window.location.hostname.startsWith('admin.');
        let isAdminMode = initialAdminMode;
        let loginRedirect = isAdminMode ? 'admin/index.html' : LOGIN_REDIRECT;

        const emailToggleBtn = document.getElementById('emailToggleBtn');
        const emailForm = document.getElementById('emailForm');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginError = document.getElementById('loginError');
        const googleStubBtn = document.getElementById('googleStubBtn');
        const rememberLoginInput = document.getElementById('rememberLogin');
        const resetPasswordModal = document.getElementById('resetPasswordModal');
        const resetNewPasswordInput = document.getElementById('resetNewPasswordInput');
        const resetPasswordSubmitBtn = document.getElementById('resetPasswordSubmitBtn');
        const topRightInfo = document.getElementById('topRightInfo');
        const signupFooter = document.getElementById('signupFooter');
        const modeMenu = document.getElementById('modeMenu');
        const modeNormalBtn = document.getElementById('modeNormalBtn');
        const modeAdminBtn = document.getElementById('modeAdminBtn');
        let pendingResetIdentifier = '';
        let pendingResetPassword = '';

        function applyModeUI() {
            loginRedirect = isAdminMode ? 'admin/index.html' : LOGIN_REDIRECT;
            if (isAdminMode) {
                topRightInfo.innerHTML = '<strong>GPT ADMIN</strong>으로 로그인 <i class="ti ti-chevron-down" style="font-size: 14px;"></i>';
                signupFooter.style.display = 'none';
            } else {
                topRightInfo.innerHTML = '<strong>MinsuGPT</strong>에 로그인 중입니다 <i class="ti ti-chevron-down" style="font-size: 14px;"></i>';
                signupFooter.style.display = '';
            }
            modeNormalBtn.classList.toggle('active', !isAdminMode);
            modeAdminBtn.classList.toggle('active', isAdminMode);
            const nextUrl = new URL(window.location.href);
            if (isAdminMode) nextUrl.searchParams.set('mode', 'admin');
            else nextUrl.searchParams.delete('mode');
            window.history.replaceState({}, '', nextUrl.toString());
        }

        function closeModeMenu() {
            modeMenu.classList.remove('show');
        }

        function openModeMenu() {
            const rect = topRightInfo.getBoundingClientRect();
            const left = Math.max(8, rect.right - 150);
            modeMenu.style.top = (rect.bottom + 6) + 'px';
            modeMenu.style.left = left + 'px';
            modeMenu.classList.add('show');
        }

        topRightInfo.addEventListener('click', (e) => {
            e.stopPropagation();
            if (modeMenu.classList.contains('show')) closeModeMenu();
            else openModeMenu();
        });
        modeNormalBtn.addEventListener('click', () => {
            isAdminMode = false;
            applyModeUI();
            closeModeMenu();
        });
        modeAdminBtn.addEventListener('click', () => {
            isAdminMode = true;
            applyModeUI();
            closeModeMenu();
        });
        document.addEventListener('click', (e) => {
            if (!modeMenu.classList.contains('show')) return;
            if (e.target.closest('#modeMenu') || e.target.closest('#topRightInfo')) return;
            closeModeMenu();
        });
        applyModeUI();

        function getStoredAuth() {
            try {
                const raw = localStorage.getItem(AUTH_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                if (!parsed || !parsed.token) return null;
                const expiresAt = Date.parse(parsed.expiresAt || '');
                if (!expiresAt || Number.isNaN(expiresAt) || Date.now() > expiresAt) {
                    localStorage.removeItem(AUTH_STORAGE_KEY);
                    return null;
                }
                return parsed;
            } catch {
                return null;
            }
        }

        function saveAuth(token, user, rememberLogin) {
            const duration = rememberLogin ? REMEMBER_LOGIN_MS : NORMAL_LOGIN_MS;
            const now = Date.now();
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
                token: token,
                user: user || null,
                remember: !!rememberLogin,
                issuedAt: new Date(now).toISOString(),
                expiresAt: new Date(now + duration).toISOString()
            }));
        }

        function parseToken(payload) {
            if (!payload || typeof payload !== 'object') return '';
            return payload.access_token || payload.token || payload.jwt || '';
        }
        function setSubmitLoading(loading) {
            submitBtn.disabled = loading;
            if (loading) {
                submitBtn.innerHTML = '<span class="btn-dots" aria-label="로그인 중"><span></span><span></span><span></span></span>';
            } else {
                submitBtn.textContent = '계속하기';
            }
        }

        if (getStoredAuth()) {
            window.location.replace(loginRedirect);
        }

        googleStubBtn.addEventListener('click', () => {
            alert('Google 로그인은 현재 준비 중입니다.');
        });

        emailToggleBtn.addEventListener('click', () => {
            emailForm.classList.add('show');
            emailToggleBtn.style.display = 'none';
            setTimeout(() => emailInput.focus(), 0);
        });

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('show');
            loginError.innerText = '';
            setSubmitLoading(true);

            try {
                const identifier = emailInput.value.trim();
                const response = await fetch(AUTH_BASE + AUTH_LOGIN_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: identifier,
                        username: identifier,
                        email: identifier,
                        password: passwordInput.value
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (response.ok) {
                    const token = parseToken(result);
                    if (!token) throw new Error('응답에서 토큰을 찾지 못했습니다.');
                    if (isAdminMode && (!result.user || result.user.username !== 'admin')) {
                        throw new Error('admin 계정만 관리자 로그인 가능합니다.');
                    }
                    saveAuth(token, result.user || null, rememberLoginInput.checked);
                    location.href = loginRedirect;
                    return;
                }
                if (result.error === 'unapproved') {
                    document.getElementById('unapprovedModal').style.display = 'flex';
                } else if (result.error === 'password_reset_required') {
                    pendingResetIdentifier = identifier;
                    pendingResetPassword = passwordInput.value;
                    resetPasswordModal.style.display = 'flex';
                } else {
                    loginError.innerText = result.message || '아이디 또는 비밀번호가 일치하지 않습니다.';
                    loginError.classList.add('show');
                }
            } catch (error) {
                console.error('Login Error:', error);
                loginError.innerText = '서버와 통신 중 오류가 발생했습니다.';
                loginError.classList.add('show');
            } finally {
                setSubmitLoading(false);
            }
        });

        resetPasswordSubmitBtn.addEventListener('click', async () => {
            const nextPassword = resetNewPasswordInput.value;
            if (!nextPassword || nextPassword.length < 8) {
                alert('새 비밀번호는 최소 8자 이상이어야 합니다.');
                return;
            }
            resetPasswordSubmitBtn.disabled = true;
            try {
                const res = await fetch(AUTH_BASE + AUTH_RESET_COMPLETE_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: pendingResetIdentifier,
                        password: pendingResetPassword,
                        newPassword: nextPassword
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    alert(data.error || data.message || '비밀번호 변경에 실패했습니다.');
                    return;
                }
                alert('비밀번호가 변경되었습니다. 다시 로그인해주세요.');
                resetPasswordModal.style.display = 'none';
                resetNewPasswordInput.value = '';
            } finally {
                resetPasswordSubmitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
