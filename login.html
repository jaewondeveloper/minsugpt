<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - MinsuGPT</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap');
        :root {
            --primary-color: #000;
            --border-color: #e5e7eb;
            --text-main: #000;
            --text-muted: #6b7280;
            --error-color: #ef4444;
        }
        * {
            box-sizing: border-box;
            font-family: 'Google Sans Flex', sans-serif;
        }
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #fff;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }
        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: 650;
            cursor: pointer;
            text-decoration: none;
            color: #000;
        }
        .top-right-info {
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 400px;
            margin: -50px auto 0 auto;
            width: 100%;
            box-sizing: border-box;
        }
        h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
            text-align: center;
        }
        .login-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            background: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            color: #000;
            text-decoration: none;
            user-select: none;
        }
        .login-btn:hover {
            background-color: #f9f9f9;
        }
        .login-btn:active {
            transform: scale(0.96);
            background-color: #ebebeb;
        }
        .login-btn.black {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }
        .login-btn.black:hover {
            background-color: #222;
        }
        .login-btn.black:active {
            transform: scale(0.96);
            background-color: #333;
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }
        .email-login-form {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .email-login-form.show {
            display: flex;
        }
        .form-inputs {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
        }
        input:focus {
            border-color: #000;
        }
        .error-message {
            color: var(--error-color);
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
            display: none;
        }
        .error-message.show {
            display: block;
        }
        .footer-info {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
        }
        .footer-info a {
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }
        .legal-footer {
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
        }
        .legal-footer a {
            color: var(--text-muted);
            text-decoration: underline;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 20px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .modal-content h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .modal-content p {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        @media (max-width: 480px) {
            h1 { font-size: 24px; }
            .top-right-info { display: none; }
            .main-container { padding: 20px 16px; margin-top: -30px; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo">MinsuGPT</a>
        <div class="top-right-info">
            <strong>MinsuGPT</strong>에 로그인 중입니다
            <i class="ti ti-chevron-down" style="font-size: 14px;"></i>
        </div>
    </header>

    <div class="main-container">
        <h1>계정에 로그인하기</h1>
        <div class="login-buttons">
            <button class="login-btn" id="googleStubBtn" type="button">
                <i class="ti ti-brand-google" style="font-size: 20px;"></i>
                Google로 로그인
            </button>
            <button class="login-btn" id="emailToggleBtn" type="button">
                <i class="ti ti-mail" style="font-size: 20px;"></i>
                이메일로 로그인
            </button>

            <form class="email-login-form" id="emailForm">
                <div class="form-inputs">
                    <input type="text" id="emailInput" placeholder="이메일 또는 아이디" required>
                    <input type="password" id="passwordInput" placeholder="비밀번호" required>
                    <div class="error-message" id="loginError"></div>
                </div>
                <button type="submit" id="submitBtn" class="login-btn black">계속하기</button>
            </form>
        </div>

        <div class="footer-info">
            계정이 없으신가요? <a href="signup.html">회원가입</a>
        </div>
    </div>

    <div class="legal-footer">
        계속 진행함으로써 MinsuGPT의 <a href="#">서비스 이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의하게 됩니다.
    </div>

    <div id="unapprovedModal" class="modal">
        <div class="modal-content">
            <h2>승인 대기 중</h2>
            <p>아직 계정이 승인되지 않았습니다.<br>관리자의 승인 완료 후 이용 가능합니다.</p>
            <button class="login-btn black" type="button" onclick="document.getElementById('unapprovedModal').style.display='none'">확인</button>
        </div>
    </div>

    <script>
        const AUTH_BASE = 'https://jaewondev6.pythonanywhere.com';
        const AUTH_LOGIN_PATH = '/api/auth/login';
        const AUTH_STORAGE_KEY = 'minsugpt_auth_v1';
        const LOGIN_REDIRECT = './';

        const emailToggleBtn = document.getElementById('emailToggleBtn');
        const emailForm = document.getElementById('emailForm');
        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginError = document.getElementById('loginError');
        const googleStubBtn = document.getElementById('googleStubBtn');

        function getStoredAuth() {
            try {
                const raw = localStorage.getItem(AUTH_STORAGE_KEY);
                if (!raw) return null;
                const parsed = JSON.parse(raw);
                return parsed && parsed.token ? parsed : null;
            } catch {
                return null;
            }
        }

        function saveAuth(token, user) {
            localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
                token: token,
                user: user || null,
                issuedAt: new Date().toISOString()
            }));
        }

        function parseToken(payload) {
            if (!payload || typeof payload !== 'object') return '';
            return payload.access_token || payload.token || payload.jwt || '';
        }

        if (getStoredAuth()) {
            window.location.replace(LOGIN_REDIRECT);
        }

        googleStubBtn.addEventListener('click', () => {
            alert('Google 로그인은 현재 준비 중입니다.');
        });

        emailToggleBtn.addEventListener('click', () => {
            emailForm.classList.add('show');
            emailToggleBtn.style.display = 'none';
            setTimeout(() => emailInput.focus(), 0);
        });

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('show');
            loginError.innerText = '';
            submitBtn.disabled = true;
            submitBtn.innerText = '로그인 중...';

            try {
                const identifier = emailInput.value.trim();
                const response = await fetch(AUTH_BASE + AUTH_LOGIN_PATH, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: identifier,
                        username: identifier,
                        email: identifier,
                        password: passwordInput.value
                    })
                });
                const result = await response.json().catch(() => ({}));
                if (response.ok) {
                    const token = parseToken(result);
                    if (!token) throw new Error('응답에서 토큰을 찾지 못했습니다.');
                    saveAuth(token, result.user || null);
                    location.href = 'index.html';
                    return;
                }
                if (result.error === 'unapproved') {
                    document.getElementById('unapprovedModal').style.display = 'flex';
                } else {
                    loginError.innerText = result.message || '아이디 또는 비밀번호가 일치하지 않습니다.';
                    loginError.classList.add('show');
                }
            } catch (error) {
                console.error('Login Error:', error);
                loginError.innerText = '서버와 통신 중 오류가 발생했습니다.';
                loginError.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '계속하기';
            }
        });
    </script>
</body>
</html>
