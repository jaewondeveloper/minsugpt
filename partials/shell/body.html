  <script>
    function iconNameMap(name) {
      const map = {
        menu: 'tabler:menu-2',
        x: 'tabler:circle-x-filled',
        'square-pen': 'tabler:pencil-filled',
        search: 'tabler:search',
        library: 'tabler:book-filled',
        user: 'tabler:user-circle-filled',
        settings: 'tabler:settings-filled',
        plus: 'heroicons:plus-20-solid',
        'chevron-down': 'tabler:caret-down-filled',
        'arrow-up': 'heroicons:arrow-up-20-solid',
        ellipsis: 'heroicons:ellipsis-horizontal-20-solid',
        pin: 'tabler:map-pin-filled',
        pencil: 'tabler:pencil-filled',
        copy: 'tabler:copy',
        check: 'tabler:check',
        'trash-2': 'tabler:trash-filled',
        'thumb-up': 'tabler:thumb-up',
        'thumb-down': 'tabler:thumb-down',
        'refresh-cw': 'tabler:refresh',
        'chevron-left': 'tabler:chevron-left',
        'chevron-right': 'tabler:chevron-right'
      };
      return map[name] || 'tabler:circle-filled';
    }

    function sidebarIconNameMap(name) {
      const map = {
        menu: 'streamline-flex:layout-right-sidebar',
        x: 'streamline-flex:remove-circle',
        'square-pen': 'streamline-flex:pencil-square',
        search: 'streamline-flex:code-analysis',
        library: 'streamline-flex:pictures-folder-memories',
        user: 'streamline-flex:user-circle-single',
        settings: 'streamline-flex:cog-circle',
        ellipsis: 'heroicons:ellipsis-horizontal-20-solid',
        pin: 'streamline-flex:pin',
        pencil: 'streamline-flex:pencil-circle'
      };
      return map[name] || iconNameMap(name);
    }

    function renderRoundedIcons(root) {
      const scope = root || document;
      scope.querySelectorAll('[data-lucide]').forEach((el) => {
        const key = el.getAttribute('data-lucide') || '';
        const iconName = el.closest('#sidebar') ? sidebarIconNameMap(key) : iconNameMap(key);
        const classes = el.className || '';
        const icon = document.createElement('iconify-icon');
        icon.setAttribute('icon', iconName);
        icon.className = classes.trim();
        icon.setAttribute('aria-hidden', 'true');
        el.replaceWith(icon);
      });
    }

    renderRoundedIcons(document);
    /* @chunk chat */

    const API_BASE = 'https://sigan.onrender.com';
    const STORAGE_KEY = 'minsugpt_chats_v1';
    const SLOT_X = [0, 11, 22];

    let chatHistory = [];
    let currentSessionId = null;
    let isSending = false;
    let isRegenerating = false;
    let loadingAnimStop = null;

    function normalizeAssistantMessage(m) {
      if (m.role !== 'assistant') return m;
      if (m.versions && m.versions.length) {
        const versionIndex = typeof m.versionIndex === 'number'
          ? Math.max(0, Math.min(m.versionIndex, m.versions.length - 1))
          : m.versions.length - 1;
        return { role: 'assistant', versions: m.versions.slice(), versionIndex };
      }
      const content = m.content || '';
      return { role: 'assistant', versions: [content], versionIndex: 0 };
    }

    function normalizeHistoryMessage(m) {
      if (m.role === 'assistant') return normalizeAssistantMessage(m);
      return { role: 'user', content: m.content || '' };
    }

    function assistantActiveContent(m) {
      const norm = normalizeAssistantMessage(m);
      const idx = norm.versionIndex ?? norm.versions.length - 1;
      return norm.versions[idx] || '';
    }

    function historyForApi(untilIndex) {
      const list = untilIndex == null ? chatHistory : chatHistory.slice(0, untilIndex);
      return list.map((m) => {
        if (m.role === 'assistant') {
          return { role: 'assistant', content: assistantActiveContent(m) };
        }
        return { role: 'user', content: m.content };
      });
    }

    function serializeHistoryForStore() {
      return chatHistory.map((m) => {
        if (m.role === 'assistant') {
          const norm = normalizeAssistantMessage(m);
          return {
            role: 'assistant',
            versions: norm.versions,
            versionIndex: norm.versionIndex
          };
        }
        return { role: 'user', content: m.content };
      });
    }

    // ── 리플 효과 (마우스 + 터치 공통) ──
    function attachRipple(button) {
      function spawnRipple(clientX, clientY) {
        const old = button.querySelector('.ripple');
        if (old) old.remove();
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        const rect = button.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 2;
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (clientX - rect.left - size / 2) + 'px';
        ripple.style.top  = (clientY - rect.top  - size / 2) + 'px';
        button.appendChild(ripple);
        requestAnimationFrame(() => { ripple.style.transform = 'scale(1)'; });
      }
      function fadeRipple() {
        const ripple = button.querySelector('.ripple');
        if (ripple) {
          ripple.classList.add('fade-out');
          setTimeout(() => ripple.remove(), 400);
        }
      }
      button.addEventListener('mousedown',   (e) => spawnRipple(e.clientX, e.clientY));
      button.addEventListener('mouseup',     fadeRipple);
      button.addEventListener('mouseleave',  fadeRipple);
      button.addEventListener('touchstart',  (e) => spawnRipple(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
      button.addEventListener('touchend',    fadeRipple, { passive: true });
      button.addEventListener('touchcancel', fadeRipple, { passive: true });
    }

    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const mobileMenuOpen = document.getElementById('mobile-menu-open');
    const newChatBtn = document.getElementById('new-chat-btn');
    const chatHistoryList = document.getElementById('chat-history-list');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const mainPanel = document.getElementById('main-panel');
    const welcomeBlock = document.getElementById('welcome-block');
    const chatMessages = document.getElementById('chat-messages');
    const chatError = document.getElementById('chat-error');
    const searchBtn = document.getElementById('mobile-search-btn');
    const mobileTopNewChat = document.getElementById('mobile-top-new-chat');
    const mobileTopMore = document.getElementById('mobile-top-more');
    const searchModal = document.getElementById('chat-search-modal');
    const searchInput = document.getElementById('chat-search-input');
    const searchClose = document.getElementById('chat-search-close');
    const searchResults = document.getElementById('chat-search-results');
    const searchPreview = document.getElementById('chat-search-preview');
    const libraryBtn = document.getElementById('mobile-library-btn');
    const mobileSearchBtn = document.getElementById('mobile-search-btn');
    const historyActionMenu = document.getElementById('history-action-menu');
    const historyActionEdit = document.getElementById('history-action-edit');
    const historyActionDuplicate = document.getElementById('history-action-duplicate');
    const historyActionDelete = document.getElementById('history-action-delete');
    const historyDialog = document.getElementById('history-dialog');
    const historyDialogTitle = document.getElementById('history-dialog-title');
    const historyDialogDesc = document.getElementById('history-dialog-desc');
    const historyDialogInput = document.getElementById('history-dialog-input');
    const historyDialogCancel = document.getElementById('history-dialog-cancel');
    const historyDialogOk = document.getElementById('history-dialog-ok');
    let historyActionTargetId = null;
    let historyDialogResolver = null;
    let gradientRAF = null;
    let gradientFrozen = false;
    let gradientTickStart = performance.now();
    let gradientWaveTimer = null;

    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true });
    }

    const isMobile = () => window.innerWidth < 768;
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const uid = () => 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

    function loadStore() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return { sessions: [], currentId: null };
        const data = JSON.parse(raw);
        return { sessions: data.sessions || [], currentId: data.currentId || null };
      } catch {
        return { sessions: [], currentId: null };
      }
    }

    function saveStore() {
      const store = loadStore();
      store.currentId = currentSessionId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function getSession(id) {
      return loadStore().sessions.find((s) => s.id === id) || null;
    }

    function closeHistoryActionMenu() {
      historyActionMenu.classList.remove('show');
      historyActionTargetId = null;
    }

    function openHistoryDialog(options) {
      const { title, description, showInput, defaultValue, okText } = options;
      historyDialogTitle.textContent = title || '확인';
      historyDialogDesc.textContent = description || '';
      historyDialogOk.textContent = okText || '확인';
      historyDialogInput.value = defaultValue || '';
      historyDialogInput.classList.toggle('hidden', !showInput);
      historyDialog.classList.add('show');

      if (showInput) {
        setTimeout(() => {
          historyDialogInput.focus();
          historyDialogInput.select();
        }, 0);
      } else {
        setTimeout(() => historyDialogOk.focus(), 0);
      }

      return new Promise((resolve) => {
        historyDialogResolver = resolve;
      });
    }

    function closeHistoryDialog(result) {
      if (historyDialogResolver) {
        historyDialogResolver(result);
        historyDialogResolver = null;
      }
      historyDialog.classList.remove('show');
    }

    function removeSessionById(id) {
      const store = loadStore();
      store.sessions = (store.sessions || []).filter((s) => s.id !== id);
      if (store.currentId === id) store.currentId = store.sessions[0]?.id || null;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
      if (!store.currentId) {
        startNewChat();
      } else if (currentSessionId === id) {
        loadSession(store.currentId);
      } else {
        renderSidebar();
      }
    }

    function duplicateSessionById(id) {
      const src = getSession(id);
      if (!src) return;
      const copy = {
        id: uid(),
        title: sessionTitle((src.title || '새 채팅') + ' 복제'),
        messages: JSON.parse(JSON.stringify(src.messages || [])),
        updatedAt: new Date().toISOString()
      };
      upsertSession(copy);
      loadSession(copy.id);
    }

    async function renameSessionById(id) {
      const target = getSession(id);
      if (!target) return;
      const renamed = await openHistoryDialog({
        title: '채팅 제목 편집',
        description: '새 제목을 입력하세요.',
        showInput: true,
        defaultValue: target.title || '',
        okText: '저장'
      });
      if (renamed === null) return;
      const value = renamed.trim();
      if (!value) return;
      target.title = value.length > 40 ? value.slice(0, 40) + '…' : value;
      target.updatedAt = new Date().toISOString();
      upsertSession(target);
      renderSidebar();
    }

    function openHistoryActionMenu(id, anchorEl) {
      historyActionTargetId = id;
      const rect = anchorEl.getBoundingClientRect();
      const top = Math.min(window.innerHeight - 140, Math.max(12, rect.top - 4));
      let left = rect.right + 8;
      if (left > window.innerWidth - 150) {
        left = Math.max(8, rect.left - 142);
      }
      historyActionMenu.style.top = `${top}px`;
      historyActionMenu.style.left = `${left}px`;
      historyActionMenu.classList.add('show');
    }

    function upsertSession(session) {
      const store = loadStore();
      const idx = store.sessions.findIndex((s) => s.id === session.id);
      if (idx >= 0) store.sessions[idx] = session;
      else store.sessions.unshift(session);
      store.sessions.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      store.currentId = session.id;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    function sessionTitle(text) {
      const t = (text || '').replace(/\s+/g, ' ').trim();
      return t.length > 28 ? t.slice(0, 28) + '…' : (t || '새 채팅');
    }

    function updateNavActiveState() {
      const isNewChatState = !currentSessionId;
      newChatBtn.classList.toggle('nav-item-active', isNewChatState);
      mobileTopNewChat.classList.toggle('nav-item-active', isNewChatState);
      if (!isNewChatState) {
        mobileSearchBtn.classList.remove('nav-item-active');
      }
    }

    function renderSidebar() {
      const store = loadStore();
      updateNavActiveState();
      chatHistoryList.innerHTML = '';
      if (!store.sessions.length) {
        const empty = document.createElement('p');
        empty.className = 'px-2 py-2 text-[11px] text-gray-400';
        empty.textContent = '채팅 기록이 없습니다';
        chatHistoryList.appendChild(empty);
        return;
      }
      store.sessions.forEach((s) => {
        const row = document.createElement('div');
        row.className = 'history-item history-pill ripple-btn flex items-center rounded-lg';
        if (s.id === currentSessionId) row.classList.add('active');
        row.dataset.id = s.id;
        const main = document.createElement('div');
        main.className = 'history-main';
        const span = document.createElement('span');
        span.className = 'truncate text-gray-600 w-full text-[12px] block';
        span.textContent = s.title || '새 채팅';
        main.appendChild(span);
        const moreBtn = document.createElement('button');
        moreBtn.type = 'button';
        moreBtn.className = 'history-more-btn ripple-btn';
        moreBtn.innerHTML = '<i data-lucide="ellipsis" class="w-3.5 h-3.5"></i>';

        row.appendChild(main);
        row.appendChild(moreBtn);
        row.addEventListener('click', (e) => {
          if (e.target.closest('.history-more-btn')) return;
          closeHistoryActionMenu();
          loadSession(s.id);
        });
        moreBtn.addEventListener('click', (e) => {

    function setGradientVars(v) {
      mainPanel.style.setProperty('--grad-x1', v.x1 + '%');
      mainPanel.style.setProperty('--grad-y1', v.y1 + '%');
      mainPanel.style.setProperty('--grad-x2', v.x2 + '%');
      mainPanel.style.setProperty('--grad-y2', v.y2 + '%');
      mainPanel.style.setProperty('--grad-c1', v.c1);
      mainPanel.style.setProperty('--grad-c2', v.c2);
    }

    function gradientStateAt(t) {
      const p = t / 1000;
      const m = (a, b, s) => Math.round(a + (b - a) * s);
      const s1 = (Math.sin(p * 0.55) + 1) / 2;
      const s2 = (Math.sin(p * 0.48 + 1.6) + 1) / 2;
      const s3 = (Math.sin(p * 0.43 + 0.7) + 1) / 2;
      return {
        x1: 34 + s1 * 20,
        y1: 28 + s2 * 18,
        x2: 62 + s2 * 16,
        y2: 56 + s3 * 18,
        c1: `rgb(${m(194, 227, s1)}, ${m(216, 241, s2)}, ${m(255, 255, s3)})`,
        c2: `rgb(${m(255, 247, s2)}, ${m(207, 224, s1)}, ${m(233, 246, s3)})`
      };
    }

    function startGradientAnimation() {
      if (gradientRAF || gradientFrozen) return;
      const tick = (now) => {
        if (gradientFrozen) {
          gradientRAF = null;
          return;
        }
        setGradientVars(gradientStateAt(now - gradientTickStart));
        gradientRAF = requestAnimationFrame(tick);
      };
      gradientRAF = requestAnimationFrame(tick);
    }

    function freezeGradientNow() {
      gradientFrozen = true;
      if (gradientRAF) {
        cancelAnimationFrame(gradientRAF);
        gradientRAF = null;
      }
    }

    function triggerGradientWave() {
      if (!mainPanel.classList.contains('chat-mode')) return;
      if (gradientWaveTimer) {
        clearTimeout(gradientWaveTimer);
        gradientWaveTimer = null;
      }
      mainPanel.classList.remove('gradient-wave');
      void mainPanel.offsetWidth;
      mainPanel.classList.add('gradient-wave');
      gradientWaveTimer = setTimeout(() => {
        mainPanel.classList.remove('gradient-wave');
        gradientWaveTimer = null;
      }, 1520);
    }

    function collectSearchResults(keyword) {
      const q = (keyword || '').trim().toLowerCase();
      const store = loadStore();
      const sessions = store.sessions || [];
      return sessions
        .map((s) => {
          const text = (s.messages || []).map((m) => {
            const norm = normalizeHistoryMessage(m);
            const body = norm.role === 'assistant' ? assistantActiveContent(norm) : norm.content;
            return `${norm.role === 'user' ? '나' : 'AI'}: ${body}`;
          }).join('\n');
          const title = (s.title || '새 채팅');
          const whole = `${title}\n${text}`.toLowerCase();
          if (!q || whole.includes(q)) {
            return {
              id: s.id,
              title,
              excerpt: text.replace(/\s+/g, ' ').trim().slice(0, 120) || '대화 내용이 없습니다.',
              full: text || '대화 내용이 없습니다.',
              updatedAt: s.updatedAt
            };
          }
          return null;
        })
        .filter(Boolean)
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
    }

    function startUserInlineEdit(wrap, bubble) {
      if (!wrap.classList.contains('latest-user') || wrap.classList.contains('is-editing')) return;
      if (isSending || isRegenerating) return;
      const originalText = (bubble.textContent || '').trim();
      wrap.classList.add('is-editing');
      bubble.classList.add('editing');
      bubble.textContent = '';
      const ta = document.createElement('textarea');

      const footer = document.createElement('div');
      footer.className = 'user-edit-footer';
      footer.innerHTML = `
        <button type="button" class="user-edit-btn cancel ripple-btn">취소</button>
        <button type="button" class="user-edit-btn confirm ripple-btn">확인</button>
      `;
      bubble.appendChild(ta);
      bubble.appendChild(footer);
      footer.querySelectorAll('.ripple-btn').forEach(attachRipple);
      resizeUserEditTextarea(ta);
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);

      const commit = async () => {
        const newText = ta.value.trim();
        if (!newText || isSending || isRegenerating) return;
        const idx = wrap._historyIndex;
        if (typeof idx !== 'number') return;
        wrap.classList.remove('is-editing');
        bubble.classList.remove('editing');
        chatHistory = chatHistory.slice(0, idx);
        reRenderChatFromHistory();
        await sendMessage(newText);

      footer.querySelector('.cancel').addEventListener('click', (e) => {
        e.stopPropagation();
        cancelUserInlineEdit(wrap, bubble, originalText);
      });
      footer.querySelector('.confirm').addEventListener('click', (e) => {
        e.stopPropagation();
        commit();
      });
      ta.addEventListener('input', () => resizeUserEditTextarea(ta));

    function updateVersionNav(wrap, actionsEl) {
      if (!actionsEl) return;
      const nav = actionsEl.querySelector('.assistant-version-nav');
      if (!nav) return;
      const idx = wrap._historyIndex;
      const m = typeof idx === 'number' ? chatHistory[idx] : null;
      if (!m || m.role !== 'assistant') return;
      const norm = normalizeAssistantMessage(m);
      const total = norm.versions.length;
      const cur = (norm.versionIndex ?? total - 1) + 1;
      nav.querySelector('.ver-label').textContent = cur + ' / ' + total;
      const prevBtn = nav.querySelector('[data-action="ver-prev"]');
      const nextBtn = nav.querySelector('[data-action="ver-next"]');
      if (prevBtn) prevBtn.disabled = cur <= 1;
      if (nextBtn) nextBtn.disabled = cur >= total;
    }

    function showAssistantVersion(wrap, bubble, delta) {
      const idx = wrap._historyIndex;
      if (typeof idx !== 'number') return;
      const m = normalizeAssistantMessage(chatHistory[idx]);
      const nextIdx = (m.versionIndex ?? m.versions.length - 1) + delta;
      if (nextIdx < 0 || nextIdx >= m.versions.length) return;
      chatHistory[idx] = { role: 'assistant', versions: m.versions, versionIndex: nextIdx };
      setAssistantHtml(bubble, m.versions[nextIdx]);
      updateVersionNav(wrap, wrap.querySelector('.assistant-actions'));
      persistCurrentSession();

    function mountTypingLoader(parent) {
      parent.innerHTML = '';
      parent.classList.add('is-loading');
      const dotsEl = document.createElement('div');
      dotsEl.className = 'typing-dots';
      dotsEl.setAttribute('aria-label', '생각 중');
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('span');
        dot.style.transform = 'translate(' + SLOT_X[i] + 'px, 0px)';
        dotsEl.appendChild(dot);
      }
      parent.appendChild(dotsEl);
      let stopAnim = function() {};
      let rafA = null;
      let rafB = null;
      rafA = requestAnimationFrame(() => {
        rafB = requestAnimationFrame(() => {
          stopAnim = startSwapLoadingAnimation(dotsEl);
        });
      });
      return function stop() {
        if (rafA) cancelAnimationFrame(rafA);
        if (rafB) cancelAnimationFrame(rafB);
        stopAnim();
        parent.classList.remove('is-loading');
      };
    }

    async function regenerateAssistantAtWrap(wrap, bubble) {
      if (isSending || isRegenerating) return;
      if (!wrap.classList.contains('latest-assistant')) return;
      const idx = wrap._historyIndex;
      if (typeof idx !== 'number') return;
      const entry = chatHistory[idx];
      if (!entry || entry.role !== 'assistant') return;
      const userMsg = chatHistory[idx - 1];
      if (!userMsg || userMsg.role !== 'user') return;
      const userText = userMsg.content || '';

      hideError();
      isRegenerating = true;
      syncRegenButtonsBusy();
      setSendLoading(true);
      wrap.classList.remove('actions-ready');
      wrap.classList.add('actions-pending');

      const stopDots = mountTypingLoader(bubble);

      try {
        const res = await fetch(API_BASE + '/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userText,
            messages: historyForApi(idx),
            system_prompt: (
              '당신은 MinsuGPT입니다. 누구나 사용할 수 있는 친절한 AI 도우미입니다. ' +
              '항상 한국어로 간결하고 따뜻하게 답하세요. 마크다운(표, 목록, 굵게)으로 보기 좋게 답하세요. ' +
              '시간표·급식·학사일정 질문은 제공된 도구 결과만 사용하고, 없으면 임의로 만들지 마세요.'
            )
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.error || ('서버 오류 (' + res.status + ')'));
        }
        const reply = (data.reply || '').trim();
        if (!reply) throw new Error('AI 응답이 비어 있습니다.');

        stopDots();

        const norm = normalizeAssistantMessage(entry);
        norm.versions.push(reply);
        norm.versionIndex = norm.versions.length - 1;
        chatHistory[idx] = norm;

        await streamAssistantReply(bubble, reply);
        triggerGradientWave();
        updateVersionNav(wrap, wrap.querySelector('.assistant-actions'));
        persistCurrentSession();
      } catch (err) {
        stopDots();
        const norm = normalizeAssistantMessage(entry);
        setAssistantHtml(bubble, assistantActiveContent(norm));
        wrap.classList.remove('actions-pending');
        wrap.classList.add('actions-ready');
        showError(err.message || '연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
        console.error('[MinsuGPT]', err);
      } finally {
        isRegenerating = false;
        syncRegenButtonsBusy();
        setSendLoading(false);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }
    }

    function attachAssistantActions(wrap, bubble, sourceUserText) {
      const actions = document.createElement('div');
      actions.className = 'assistant-actions';
      actions.innerHTML = `
        <button type="button" class="assistant-action-btn ripple-btn" data-action="like"><i data-lucide="thumb-up" class="w-3.5 h-3.5"></i></button>

        <button type="button" class="assistant-action-btn ripple-btn" data-action="regen"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></button>
        <button type="button" class="assistant-action-btn ripple-btn" data-action="copy"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
        <button type="button" class="assistant-action-btn ripple-btn" data-action="more"><i data-lucide="ellipsis" class="w-3.5 h-3.5"></i></button>
        <div class="assistant-version-nav">
          <button type="button" class="assistant-action-btn ripple-btn" data-action="ver-prev" aria-label="이전 답변"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
          <span class="ver-label">1 / 1</span>
          <button type="button" class="assistant-action-btn ripple-btn" data-action="ver-next" aria-label="다음 답변"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
        </div>
      `;
      wrap.appendChild(actions);
      actions.querySelectorAll('.assistant-action-btn').forEach((btn) => {
        attachRipple(btn);
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const action = btn.dataset.action;
          if (action === 'like') {
            btn.classList.toggle('active');
            actions.querySelector('[data-action="dislike"]').classList.remove('active');
            return;
          }
          if (action === 'dislike') {
            btn.classList.toggle('active');
            actions.querySelector('[data-action="like"]').classList.remove('active');
            return;
          }
          if (action === 'copy') {

          if (action === 'ver-prev') {
            showAssistantVersion(wrap, bubble, -1);
            return;
          }
          if (action === 'ver-next') {
            showAssistantVersion(wrap, bubble, 1);
            return;
          }
          if (action === 'regen') {
            if (!wrap.classList.contains('latest-assistant') || isSending || isRegenerating) return;
            await regenerateAssistantAtWrap(wrap, bubble);
            return;
          }
          if (action === 'more') {
            showError('추가 옵션 준비 중');
            setTimeout(hideError, 900);
          }
        });
      });
      renderRoundedIcons(actions);
      updateVersionNav(wrap, actions);
      updateAssistantActionVisibility();
    }

    function appendMarkdownBlock(container, mdText) {
      if (!mdText.trim()) return;
      const tmp = document.createElement('div');
      tmp.innerHTML = typeof marked !== 'undefined'

        : mdText.replace(/</g, '&lt;').replace(/\n/g, '<br>');

    function parseContentSegments(text) {
      const segments = [];
      const tableRe = /(?:^|\n)(\|[^\n]+\|\n\|[-:\s|]+\|\n(?:\|[^\n]+\|\n?)*)/g;
      let last = 0;
      let match;
      while ((match = tableRe.exec(text)) !== null) {
        if (match.index > last) {
          segments.push({ type: 'text', content: text.slice(last, match.index) });
        }
        segments.push({ type: 'table', content: match[1].trim() });
        last = match.index + match[0].length;
      }
      if (last < text.length) {
        segments.push({ type: 'text', content: text.slice(last) });
      }
      if (!segments.length) segments.push({ type: 'text', content: text });
      return segments;
    }

    function findFreezePoint(acc, from) {
      const rest = acc.slice(from);
      const para = rest.indexOf('\n\n');
      if (para >= 0) return from + para + 2;
      const line = rest.indexOf('\n');
      if (line >= 0) return from + line + 1;
      return from;
    }

    function ensureStreamTail(body) {
      let tail = body.querySelector('.md-stream-tail');
      if (!tail) {
        tail = document.createElement('div');
        tail.className = 'md-tail md-stream-tail';
        body.appendChild(tail);
      }
      return tail;
    }

    function freezeTailSegment(body, mdText) {
      if (!mdText || !mdText.trim()) return;
      const tail = body.querySelector('.md-stream-tail');
      const block = document.createElement('div');
      block.className = 'md-frozen-block';
      appendMarkdownBlock(block, mdText);
      if (tail) body.insertBefore(block, tail);
      else body.appendChild(block);
      if (tail) tail.innerHTML = '';
    }

    function freezePendingTail(body) {
      const tail = body.querySelector('.md-stream-tail');
      if (!tail) return;
      const pending = tail.textContent || '';
      tail.innerHTML = '';
      if (pending.trim()) freezeTailSegment(body, pending);
    }

    function createTablePlaceholder(body, tableMd) {
      freezePendingTail(body);
      const tail = ensureStreamTail(body);
      const slot = document.createElement('div');
      slot.className = 'md-table-slot';
      slot.dataset.tableMd = tableMd;

      const card = document.createElement('div');
      card.className = 'table-loading-card';
      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.setAttribute('aria-label', '표 생성 중');
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('span');
        dot.style.transform = 'translate(' + SLOT_X[i] + 'px, 0px)';
        dots.appendChild(dot);
      }
      const label = document.createElement('span');
      label.textContent = '표를 생성하는 중';
      card.appendChild(dots);
      card.appendChild(label);
      slot.appendChild(card);
      body.insertBefore(slot, tail);
      slot._stopAnim = startSwapLoadingAnimation(dots);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return slot;
    }

    async function streamTextWithFade(body, text) {
      if (!text) return;
      const tail = ensureStreamTail(body);
      const chunks = splitWordChunks(text);
      let acc = '';
      let frozenLen = 0;

      for (let i = 0; i < chunks.length; i++) {
        acc += chunks[i];
        const span = document.createElement('span');
        span.className = 'md-word-fade';
        span.textContent = chunks[i];
        tail.appendChild(span);

        let freezeAt = findFreezePoint(acc, frozenLen);
        while (freezeAt > frozenLen) {
          freezeTailSegment(body, acc.slice(frozenLen, freezeAt));
          frozenLen = freezeAt;
          const rest = acc.slice(frozenLen);
          tail.innerHTML = '';
          if (rest) {
            const restSpan = document.createElement('span');
            restSpan.className = 'md-word-fade';
            restSpan.textContent = rest;
            tail.appendChild(restSpan);
          }
          freezeAt = findFreezePoint(acc, frozenLen);
        }

        chatMessages.scrollTop = chatMessages.scrollHeight;
        await sleep(48);
      }

      if (acc.slice(frozenLen).trim()) {
        freezeTailSegment(body, acc.slice(frozenLen));
      }
    }

    function splitWordChunks(text) {
      const parts = text.match(/\S+|\s+/g) || [];
      const chunks = [];
      let buf = '';
      for (const p of parts) {
        buf += p;
        if (p.trim()) {
          chunks.push(buf);
          buf = '';
        }
      }
      if (buf) chunks.push(buf);
      return chunks;
    }

    /* @chunk boot */
    async function streamAssistantReply(bubble, fullText) {
      const body = document.createElement('div');
      body.className = 'md-body';
      bubble.innerHTML = '';
      bubble.appendChild(body);

      const segments = parseContentSegments(fullText);
      const tableSlots = [];

      for (const seg of segments) {
        if (seg.type === 'text') {
          await streamTextWithFade(body, seg.content);
        } else {
          const slot = createTablePlaceholder(body, seg.content);
          tableSlots.push(slot);
          await sleep(520);
        }
      }

      const tail = body.querySelector('.md-stream-tail');
      if (tail) tail.remove();

      for (const slot of tableSlots) {
        if (slot._stopAnim) slot._stopAnim();
        const md = slot.dataset.tableMd || '';
        const block = document.createElement('div');
        block.className = 'md-frozen-block';
        appendMarkdownBlock(block, md);
        slot.replaceWith(block);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        await sleep(120);
      }

      setAssistantHtml(bubble, fullText);
      const wrap = bubble.closest('.assistant-msg-wrap');
      if (wrap) {
        wrap.classList.remove('actions-pending');
        wrap.classList.add('actions-ready');
        updateVersionNav(wrap, wrap.querySelector('.assistant-actions'));
        updateAssistantActionVisibility();
      }
    }

    function startSwapLoadingAnimation(container) {
      const dots = [];
      for (let i = 0; i < 3; i++) {
        const dot = container.children[i];
        if (dot && dot.tagName === 'SPAN') dots.push(dot);
      }
      if (dots.length < 3) return function() {};

      const xPos = [SLOT_X[0], SLOT_X[1], SLOT_X[2]];
      const pairs = [[0, 1], [1, 2], [0, 2]];
      const BOUNCE_MS = 1100;
      const MOVE_MS = 520;
      const CYCLE_MS = BOUNCE_MS + MOVE_MS;
      const t0 = performance.now();
      let committedCycle = -1;

      function arcY(t, sign) {
        return sign * 7 * 4 * t * (1 - t);
      }

      function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      }

      dots.forEach((d, i) => {
        d.style.transform = 'translate(' + xPos[i] + 'px, 0px)';
      });

      function tick(now) {
        const elapsed = now - t0;
        const cycleNum = Math.floor(elapsed / CYCLE_MS);
        const local = elapsed - cycleNum * CYCLE_MS;
        const pair = pairs[cycleNum % pairs.length];
        const a = pair[0];
        const b = pair[1];

        if (local < BOUNCE_MS) {
          const bounceT = local / 1000;
          dots.forEach((d, i) => {
            const y = Math.sin(bounceT * 4.2 + i * 0.85) * 4;
            d.style.transform = 'translate(' + xPos[i] + 'px, ' + y + 'px)';
          });
        } else {
          const st = Math.min(1, (local - BOUNCE_MS) / MOVE_MS);
          const e = easeInOut(st);
          const fromA = xPos[a];
          const fromB = xPos[b];
          const xA = fromA + (fromB - fromA) * e;
          const xB = fromB + (fromA - fromB) * e;

          dots.forEach((d, i) => {
            let x = xPos[i];
            let y = 0;
            if (i === a) {
              x = xA;
              y = arcY(e, -1);
            } else if (i === b) {
              x = xB;
              y = arcY(e, 1);
            }
            d.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
          });

          if (st >= 1 && committedCycle !== cycleNum) {
            const tmp = xPos[a];
            xPos[a] = xPos[b];
            xPos[b] = tmp;
            committedCycle = cycleNum;
          }
        }

        raf = requestAnimationFrame(tick);
      }

      let raf = requestAnimationFrame(tick);
      return function() { cancelAnimationFrame(raf); };
    }

    function createLoadingBubble() {
      const wrap = document.createElement('div');
      wrap.className = 'flex w-full justify-start';
      const bubble = document.createElement('div');
      bubble.className = 'msg-assistant';
      wrap.appendChild(bubble);
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      const stop = mountTypingLoader(bubble);
      loadingAnimStop = stop;
      return { wrap, bubble, stop };
    }

    function stopLoading(loader) {
      if (loader && loader.stop) loader.stop();
      else if (loadingAnimStop) {
        loadingAnimStop();
      }
      loadingAnimStop = null;
    }

    function appendMessage(role, content, opts) {
      opts = opts || {};
      const wrap = document.createElement('div');
      wrap.className = 'flex w-full ' + (role === 'user' ? 'justify-end' : 'justify-start max-w-full');
      if (typeof opts.historyIndex === 'number') wrap._historyIndex = opts.historyIndex;
      const bubble = document.createElement('div');
      if (role === 'user') {
        wrap.classList.add('user-msg-wrap');
        bubble.className = 'msg-user text-[14px] leading-relaxed';
        bubble.textContent = content;
      } else {
        wrap.classList.add('assistant-msg-wrap');
        bubble.className = 'msg-assistant text-[14px] leading-relaxed';
        const versions = opts.versions || [content];
        const versionIndex = typeof opts.versionIndex === 'number'
          ? opts.versionIndex
          : versions.length - 1;
        setAssistantHtml(bubble, versions[versionIndex] || content);
      }
      wrap.appendChild(bubble);
      if (role === 'user') {
        attachUserActions(wrap, bubble);
      }
      if (role === 'assistant') {
        attachAssistantActions(wrap, bubble, opts.sourceUserText || '');
        if (opts.deferActions) wrap.classList.add('actions-pending');
        else wrap.classList.add('actions-ready');
      }
      chatMessages.appendChild(wrap);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (role === 'user') updateUserActionVisibility();
      if (role === 'assistant') updateAssistantActionVisibility();
      return { bubble, wrap };
    }

    function persistCurrentSession() {
      if (!currentSessionId) return;
      const existing = getSession(currentSessionId);
      if (!existing) return;
      existing.messages = serializeHistoryForStore();
      existing.updatedAt = new Date().toISOString();
      upsertSession(existing);
      renderSidebar();
    }

    function ensureSession(firstUserText) {
      if (currentSessionId && getSession(currentSessionId)) return;
      const session = {
        id: uid(),
        title: sessionTitle(firstUserText),
        messages: [],
        updatedAt: new Date().toISOString()
      };
      currentSessionId = session.id;
      upsertSession(session);
      renderSidebar();
    }

    function clearChatView() {
      chatMessages.innerHTML = '';
      chatHistory = [];
      hideError();
    }

    function startNewChat() {
      stopLoading();
      isSending = false;
      currentSessionId = null;
      gradientFrozen = false;
      gradientTickStart = performance.now();
      saveStore();
      clearChatView();
      showWelcomeLayout();
      renderSidebar();
      chatInput.value = '';
      chatInput.style.height = '24px';
      chatInput.dispatchEvent(new Event('input'));
      chatInput.focus();
      if (isMobile()) closeMobileSidebar();
    }

    function loadSession(id) {
      const session = getSession(id);
      if (!session) return;
      stopLoading();
      currentSessionId = id;
      saveStore();
      clearChatView();
      chatHistory = (session.messages || []).map((m) => normalizeHistoryMessage(m));
      if (chatHistory.length) {
        showChatLayout();
        reRenderChatFromHistory();
      } else {
        showWelcomeLayout();
      }
      renderSidebar();
      hideError();
      if (isMobile()) closeMobileSidebar();
    }

    function setSendLoading(loading) {
      isSending = loading;
      syncRegenButtonsBusy();
      sendBtn.disabled = loading || chatInput.value.trim().length === 0;
      if (loading) {
        sendBtn.classList.add('opacity-60', 'pointer-events-none');
      } else {
        sendBtn.classList.remove('opacity-60', 'pointer-events-none');
        chatInput.dispatchEvent(new Event('input'));
      }
    }

    async function sendMessage(overrideText) {
      const text = (overrideText != null ? String(overrideText) : chatInput.value).trim();
      if (!text || isSending) return;
      if (!gradientFrozen && chatHistory.length === 0) freezeGradientNow();

      hideError();
      ensureSession(text);
      showChatLayout();
      const userResult = appendMessage('user', text);
      const userWrap = userResult.wrap;

      const session = getSession(currentSessionId);
      if (session && session.title === '새 채팅') {
        session.title = sessionTitle(text);
        upsertSession(session);
        renderSidebar();
      }

      if (overrideText == null) {
        chatInput.value = '';
        chatInput.style.height = '24px';
      }
      setSendLoading(true);

      const loader = createLoadingBubble();

      try {
        const res = await fetch(API_BASE + '/api/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            messages: historyForApi(),
            system_prompt: (
              '당신은 MinsuGPT입니다. 누구나 사용할 수 있는 친절한 AI 도우미입니다. ' +
              '항상 한국어로 간결하고 따뜻하게 답하세요. 마크다운(표, 목록, 굵게)으로 보기 좋게 답하세요. ' +
              '시간표·급식·학사일정 질문은 제공된 도구 결과만 사용하고, 없으면 임의로 만들지 마세요.'
            )
          })
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.error || ('서버 오류 (' + res.status + ')'));
        }

        const reply = (data.reply || '').trim();
        if (!reply) throw new Error('AI 응답이 비어 있습니다.');

        stopLoading(loader);
        loader.wrap.remove();

        chatHistory.push({ role: 'user', content: text });
        userWrap._historyIndex = chatHistory.length - 1;

        const assistantResult = appendMessage('assistant', '', {
          sourceUserText: text,
          deferActions: true,
          historyIndex: chatHistory.length
        });
        const assistantWrap = assistantResult.wrap;
        const bubble = assistantResult.bubble;

        await streamAssistantReply(bubble, reply);
        triggerGradientWave();

        chatHistory.push({ role: 'assistant', versions: [reply], versionIndex: 0 });
        assistantWrap._historyIndex = chatHistory.length - 1;
        updateVersionNav(assistantWrap, assistantWrap.querySelector('.assistant-actions'));
        persistCurrentSession();
      } catch (err) {
        stopLoading(loader);
        loader.wrap.remove();
        showError(err.message || '연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');
        console.error('[MinsuGPT]', err);
      } finally {
        setSendLoading(false);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        chatInput.focus();
      }
    }

    newChatBtn.addEventListener('click', startNewChat);
    mobileTopNewChat.addEventListener('click', startNewChat);
    mobileTopMore.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentSessionId || !getSession(currentSessionId)) {
        openMobileSidebar();
        return;
      }
      openHistoryActionMenu(currentSessionId, mobileTopMore);
    });
    searchBtn.addEventListener('click', openSearchModal);
    searchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
    searchClose.addEventListener('click', closeSearchModal);
    searchModal.addEventListener('click', (e) => {
      if (e.target === searchModal) closeSearchModal();
    });
    libraryBtn.addEventListener('click', () => {
      showError('라이브러리는 준비 중입니다.');
      setTimeout(hideError, 1500);
      if (isMobile()) closeMobileSidebar();
    });

    (function init() {
      renderSidebar();
      startGradientAnimation();
      const store = loadStore();
      if (store.currentId && getSession(store.currentId)) {
        loadSession(store.currentId);
        freezeGradientNow();
      }
    })();

    const sidebarBackdrop = document.getElementById('sidebar-backdrop');
    const sidebarCloseMobile = document.getElementById('sidebar-close-mobile');
    const menuBtnWrap = document.getElementById('mobile-menu-btn-wrap');
    const mobileTopActions = document.getElementById('mobile-top-actions');

    function openMobileSidebar() {
      // 버튼 숨기기
      if (menuBtnWrap) menuBtnWrap.style.display = 'none';
      if (mobileTopActions) mobileTopActions.style.display = 'none';

      sidebar.style.transition = 'none';
      sidebar.style.transform = 'translateX(-100%)';
      sidebar.classList.remove('hidden');
      sidebarBackdrop.style.opacity = '0';
      sidebarBackdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          sidebar.style.transition = '';
          sidebar.style.transform = 'translateX(0)';
          sidebarBackdrop.style.opacity = '1';
        });
      });
    }

    function closeMobileSidebar() {
      sidebar.style.transition = '';
      sidebar.style.transform = 'translateX(-100%)';
      sidebarBackdrop.style.opacity = '0';
      setTimeout(() => {
        sidebar.classList.add('hidden');
        sidebarBackdrop.classList.add('hidden');
        // 버튼 다시 보이기
        if (menuBtnWrap) menuBtnWrap.style.display = '';
        if (mobileTopActions) mobileTopActions.style.display = '';
      }, 380);
    }

    function handleResize() {
      if (isMobile()) {
        sidebar.classList.add('hidden');
        sidebar.classList.remove('sidebar-mini');
        sidebar.style.transform = 'translateX(-100%)';
      } else {
        sidebar.classList.remove('hidden');
        sidebar.style.transform = 'translateX(0)';
      }
    }
    window.addEventListener('resize', handleResize);
    handleResize(); // 즉시 실행 (DOMContentLoaded 이미 지난 경우 대비)

    if (sidebarToggle) {
      sidebarToggle.addEventListener('click', function() {
        if (isMobile()) {
          closeMobileSidebar();
        } else {
          sidebar.classList.toggle('sidebar-mini');
        }
      });
    }

    mobileMenuOpen.addEventListener('click', function() {
      openMobileSidebar();
    });

    sidebarCloseMobile.addEventListener('click', function() {
      closeMobileSidebar();
    });

    sidebarBackdrop.addEventListener('click', function() {
      closeMobileSidebar();
    });

    let touchStartX = 0;
    let touchCurrentX = 0;
    let isSwiping = false;

    sidebar.addEventListener('touchstart', function(e) {
      if (!isMobile()) return;
      touchStartX = e.changedTouches[0].clientX;
      touchCurrentX = touchStartX;
      isSwiping = true;
      sidebar.style.transition = 'none';
      sidebarBackdrop.style.transition = 'none';
    }, { passive: true });

    sidebar.addEventListener('touchmove', function(e) {
      if (!isMobile() || !isSwiping) return;
      touchCurrentX = e.changedTouches[0].clientX;
      const dx = touchCurrentX - touchStartX;
      if (dx < 0) {
        sidebar.style.transform = 'translateX(' + dx + 'px)';
        const progress = Math.min(1, Math.abs(dx) / window.innerWidth);
        sidebarBackdrop.style.opacity = String(1 - progress);
      }
    }, { passive: true });

    sidebar.addEventListener('touchend', function(e) {
      if (!isMobile() || !isSwiping) return;
      isSwiping = false;
      sidebar.style.transition = '';
      sidebarBackdrop.style.transition = '';
      const dx = touchCurrentX - touchStartX;
      if (dx < -60) {
        closeMobileSidebar();
      } else {
        sidebar.style.transform = 'translateX(0)';
        sidebarBackdrop.style.opacity = '1';
      }
    }, { passive: true });

    chatInput.addEventListener('input', function() {
      if (this.value.trim().length > 0) {
        sendBtn.disabled = false;
        sendBtn.classList.remove('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
        sendBtn.classList.add('bg-[#74b9ff]', 'text-white', 'cursor-pointer', 'shadow-sm');
      } else {
        sendBtn.disabled = true;
        sendBtn.classList.remove('bg-[#74b9ff]', 'text-white', 'cursor-pointer', 'shadow-sm');
        sendBtn.classList.add('bg-gray-100', 'text-gray-400', 'cursor-not-allowed');
      }

      this.style.height = '24px'; 
      let nextHeight = this.scrollHeight;
      this.style.height = (this.value === '') ? '24px' : nextHeight + 'px';
    });

    sendBtn.addEventListener('click', () => sendMessage());

    chatInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (this.value.trim().length > 0) sendMessage();
      }
    });

    // ── 모바일 키보드 대응: visualViewport로 키보드 높이 감지 → main-panel 높이 조정 ──
    if (window.visualViewport && isMobile()) {
      function onViewportResize() {
        if (!isMobile()) return;
        const kbHeight = window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop;
        if (kbHeight > 50) {
          // 키보드 올라옴: body 하단 패딩을 키보드 높이만큼 줘서 입력창이 위로 밀림
          document.body.style.paddingBottom = kbHeight + 'px';
          // 채팅이면 스크롤 맨 아래로
          if (!chatMessages.classList.contains('hidden')) {
            setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
          }
        } else {
          document.body.style.paddingBottom = 'env(safe-area-inset-bottom)';
        }
      }
      window.visualViewport.addEventListener('resize', onViewportResize);
      window.visualViewport.addEventListener('scroll', onViewportResize);
    }

    document.querySelectorAll('.ripple-btn').forEach(attachRipple);
  </script>
